<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Page</title>
    <style>
        body {
            margin: 0;
            font-family: VictorMono Nerd Font Mono;
            font-size: 1em;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: black;
            color: white;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }

        header {
            background-color: #222;
            top: 0;
            padding: 10px;
            text-align: center;
            width: 100%;
            position: fixed;
            z-index: 1000;
        }

        #background-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            background-size: cover;
            opacity: 0;
            transition: opacity 10s ease-in;
        }

        #background-video.visible {
            opacity: 1;
        }

        #logo {
            position: fixed;
            top: 75px;
            right: 10px;
            max-width: 100px;
        }

        #clock {
            font-size: 5em;
            text-align: center;
            flex: 1;
            min-width: 250px;
            margin: 10px;
        }

        .containers-wrapper {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 1200px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .container {
            text-align: center;
            flex: 1;
            min-width: 250px;
            margin: 10px;
        }

        .bookmarks {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bookmarks a {
            padding: 8px 12px;
            background-color: rgba(254, 254, 254, 0.9);
            color: black;
            text-decoration: none;
            border-radius: 5px;
            white-space: nowrap;
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-direction: column;
            align-items: center;
        }

        .search-input-group {
            display: flex;
            width: 80%;
            max-width: 1000px;
            align-items: center;
        }

        .search-input {
            flex-grow: 1;
            padding: 10px 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.25);
        }

        .search-engine-select {
            padding: 8px 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.25);
        }

        body.fallback-background {
            background-image: url('/usr/share/wallpapers/Next/contents/images/1920x1080.png');
            background-size: cover;
            background-attachment: fixed;
        }

        @media (max-width: 768px) {
            main {
                padding: 20px;
            }

            #clock {
                font-size: 3em;
            }

            .containers-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .container {
                min-width: unset;
                width: 90%;
                margin: 10px 0;
            }

            .search-input-group {
                flex-direction: column;
                width: 90%;
            }

            .search-engine-select {
                margin-right: 0;
                margin-bottom: 10px;
                width: 100%;
            }

            .search-input {
                width: 100%;
            }

            .bookmarks a {
                padding: 6px 10px;
                font-size: 0.9em;
            }

            footer {
                position: relative;
            }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .animate-slide-down { animation: slideDown 0.5s ease-out forwards; }
            .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
            .animate-slide-in-left { animation: slideInLeft 0.5s ease-out forwards; }
            .animate-slide-in-right { animation: slideInRight 0.5s ease-out forwards; }
            .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }

            :root {
                --delay-1: 100ms;
                --delay-2: 200ms;
                --delay-3: 300ms;
                --delay-4: 400ms;
                --delay-5: 500ms;
                --delay-6: 600ms;
                --delay-7: 700ms;
                --delay-8: 800ms;
            }
            .delay-1 { animation-delay: var(--delay-1); }
            .delay-2 { animation-delay: var(--delay-2); }
            .delay-3 { animation-delay: var(--delay-3); }
            .delay-4 { animation-delay: var(--delay-4); }
            .delay-5 { animation-delay: var(--delay-5); }
            .delay-6 { animation-delay: var(--delay-6); }
            .delay-7 { animation-delay: var(--delay-7); }
            .delay-8 { animation-delay: var(--delay-8); }

            .bookmarks a:nth-child(1) { animation-delay: 100ms; }
            .bookmarks a:nth-child(2) { animation-delay: 150ms; }
            .bookmarks a:nth-child(3) { animation-delay: 200ms; }
            .bookmarks a:nth-child(4) { animation-delay: 250ms; }
            .bookmarks a:nth-child(5) { animation-delay: 300ms; }
            .bookmarks a:nth-child(6) { animation-delay: 350ms; }
            .bookmarks a:nth-child(7) { animation-delay: 400ms; }
            .bookmarks a:nth-child(8) { animation-delay: 450ms; }
            .bookmarks a:nth-child(9) { animation-delay: 500ms; }
            .bookmarks a:nth-child(10) { animation-delay: 550ms; }
            .bookmarks a:nth-child(11) { animation-delay: 600ms; }
            .bookmarks a:nth-child(12) { animation-delay: 650ms; }
            .bookmarks a:nth-child(13) { animation-delay: 700ms; }
            .bookmarks a:nth-child(14) { animation-delay: 750ms; }
            .bookmarks a:nth-child(15) { animation-delay: 800ms; }
        }
    </style>
</head>

<body>
    <header class="animate-slide-down">
        <div id="header-info"></div>
    </header>
    <video id="background-video" muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <img id="logo" src="logo.png" alt="Logo" class="animate-slide-in-right delay-1" />
    <main>
        <div class="clock animate-slide-up delay-1" id="clock"></div>

        <div class="container animate-slide-up delay-2" id="date"></div>
        <div class="search-container animate-slide-up delay-3">
            <div class="search-input-group">
                <select id="searchEngineSelect" class="search-engine-select"></select>
                <input type="text" id="unifiedSearch" class="search-input"
                    placeholder="Search Google or paste image for image search" autofocus />
            </div>
        </div>
        <div class="containers-wrapper">
            <div class="container animate-slide-in-left delay-1">
                <h3>Email & Productivity</h3>
                <div class="bookmarks" id="emailProductivity"></div>
            </div>
            <div class="container animate-slide-in-right delay-2">
                <h3>Network & Admin</h3>
                <div class="bookmarks" id="networkAdmin"></div>
            </div>
            <div class="container animate-slide-in-left delay-3">
                <h3>Tech & Dev</h3>
                <div class="bookmarks" id="techDev"></div>
            </div>
            <div class="container animate-slide-in-right delay-4">
                <h3>News & Media</h3>
                <div class="bookmarks" id="newsMedia"></div>
            </div>
            <div class="container animate-slide-in-left delay-5">
                <h3>Search & AI</h3>
                <div class="bookmarks" id="searchAI"></div>
            </div>
            <div class="container animate-slide-in-right delay-6">
                <h3>Social & Communication</h3>
                <div class="bookmarks" id="socialCommunication"></div>
            </div>
            <div class="container animate-slide-in-left delay-7">
                <h3>Entertainment</h3>
                <div class="bookmarks" id="entertainment"></div>
            </div>
        </div>
    </main>

    <script>





        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString("en-US", { hour12: false });
            document.getElementById("clock").textContent = time;

            const dateOptions = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
            };
            const gregorianDate = now.toLocaleDateString(
                "en-US",
                dateOptions,
            );
            document.getElementById("date").textContent = gregorianDate;
        }

        setInterval(updateClock, 1000);
        updateClock();

        const unifiedSearch = document.getElementById("unifiedSearch");
        const searchEngineSelect = document.getElementById("searchEngineSelect");

        const searchEngines = {
            "GoogleAI": "https://www.google.com/search?udm=50&q=",
            "Google": "https://www.google.com/search?udm=14&hl=en&ogbl&q=",
            "Google Images": "https://www.google.com/search?tbm=isch&q=",
            "DuckDuckGo": "https://duckduckgo.com/?q=",
            "Bing": "https://www.bing.com/search?q=",
            "Yahoo": "https://search.yahoo.com/search?p=",
            "Baidu": "https://www.baidu.com/s?wd=",
            "Yandex": "https://yandex.com/search/?text=",
            "Ecosia": "https://www.ecosia.org/search?q=",
            "Startpage": "https://www.startpage.com/do/search?query=",
            "Brave Search": "https://search.brave.com/search?q=",
            "Ask.com": "https://www.ask.com/web?q=",
            "AOL Search": "https://search.aol.com/aol/search?q=",
            "WolframAlpha": "https://www.wolframalpha.com/input?i=",
            "Wikipedia": "https://en.wikipedia.org/wiki/Special:Search?search=",
            "YouTube": "https://www.youtube.com/results?search_query=",
            "Amazon": "https://www.amazon.com/s?k=",
            "eBay": "https://www.ebay.com/sch/i.html?_nkw=",
            "Reddit": "https://www.reddit.com/search/?q=",
            "Stack Overflow": "https://stackoverflow.com/search?q=",
            "GitHub": "https://github.com/search?q=",
            "NPM": "https://www.npmjs.com/search?q=",
            "MDN Web Docs": "https://developer.mozilla.org/en-US/search?q=",
            "Arch Wiki": "https://wiki.archlinux.org/index.php?search=",
            "AUR": "https://aur.archlinux.org/packages?K=",
            "LAVteam": "https://lavteam.org/search?q=",
            "dpreview": "https://www.dpreview.com/search?q=",
            "Engadget": "https://www.engadget.com/search?query=",
            "GSM Arena": "https://www.gsmarena.com/results.php3?sSearch=",
            "Petromindo": "https://www.petromindo.com/search?q=",
            "DI.FM": "https://www.di.fm/search?q=",
            "LK21": "https://lk21.de/search?q=",
            "Gudang21": "https://wpt.gudang21.top/search?q=",
            "Pornhub": "https://www.pornhub.com/video/search?search=",
            "AVtub": "https://avtub.pet/search?q=",
        };

        // Populate the search engine dropdown
        for (const engineName in searchEngines) {
            const option = document.createElement("option");
            option.value = searchEngines[engineName];
            option.textContent = engineName;
            searchEngineSelect.appendChild(option);
        }

        function performSearch(query) {
            const selectedEngineUrl = searchEngineSelect.value;
            if (query) {
                window.open(`${selectedEngineUrl}${encodeURIComponent(query)}`, "_blank");
            }
        }

        unifiedSearch.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                performSearch(unifiedSearch.value);
            }
        });

        unifiedSearch.addEventListener("paste", (event) => {
            const clipboardData = event.clipboardData || event.originalEvent.clipboardData;
            const items = clipboardData.items;

            let isImage = false;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf("image") !== -1) {
                    isImage = true;
                    break;
                }
            }

            if (isImage) {
                window.open("https://lens.google.com/?pli=1", "_blank");
            } else {
                const pastedText = clipboardData.getData('text/plain');
                unifiedSearch.value = pastedText;
                performSearch(pastedText);
            }
            event.preventDefault(); // Prevent default paste behavior
        });

        const bookmarks = {
            emailProductivity: [
                { name: "Outlook", url: "https://outlook.office.com/mail/" },

            ],
            networkAdmin: [

                { name: "Router 2", url: "http://192.168.2.1/" },
                { name: "Router 3", url: "http://192.168.3.1/" },
                { name: "Router 11", url: "http://192.168.11.1/" },
                { name: "Router 88", url: "http://192.168.88.1/" },
                { name: "9Router", url: "http://localhost:20128/dashboard" },
                { name: "FreeLLM", url: "http://127.0.0.1:31415" },
                { name: "dnscheck", url: "http://dnscheck.tools/" },
                { name: "DNSCrypt Stats", url: "http://127.0.0.1:53535/" },
                { name: "nextdns analytics", url: "https://my.nextdns.io/3fa2f6/analytics" },
                { name: "fast speedtest", url: "https://fast.com" },
		{ name: "bufferbloat test", url: "https://www.waveform.com/tools/bufferbloat" },
            ],
            techDev: [
                { name: "Archlinux", url: "https://archlinux.org" },
                { name: "Archlinux - Wiki", url: "https://wiki.archlinux.org" },
                { name: "Archlinux - Aur", url: "https://aur.archlinux.org" },
                { name: "Github", url: "https://github.com/ariefra" },
                { name: "Stack Overflow", url: "https://stackoverflow.com/search?q=" },
                { name: "NPM", url: "https://www.npmjs.com/search?q=" },
                { name: "MDN Web Docs", url: "https://developer.mozilla.org/en-US/search?q=" },
                { name: "Yarrlist", url: "https://yarrlist.net/" },
                { name: "CPU Benchmark", url: "https://www.cpubenchmark.net/CPU_mega_page.html" },
            ],
            newsMedia: [
                { name: "LAVteam", url: "https://lavteam.org/" },
                { name: "Photography", url: "https://dpreview.com" },
                { name: "Gadget", url: "https://endgadget.com" },
                { name: "GSM Arena", url: "https://gsmarena.com" },
                { name: "EV Arena", url: "https://www.arenaev.com" },
                { name: "Petromindo", url: "https://www.petromindo.com/job-gallery" },
            ],
            searchAI: [
                { name: "Google", url: "https://google.com/" },

            ],

            ],
            entertainment: [
                { name: "YouTube", url: "https://www.youtube.com/" },
                { name: "TikTok", url: "https://www.tiktok.com/" },
                { name: "DI.FM", url: "https://www.di.fm/" },

                { name: "LK21mob", url: "https://lk21.mobile" },

        // for (const group in bookmarks) {
        //     const container = document.getElementById(group);
        //     bookmarks[group].forEach((bookmark) => {
        //         const link = document.createElement("a");
        //         link.href = bookmark.url;
        //         link.textContent = bookmark.name;
        //         container.appendChild(link);
        //     });
        // }

        for (const group in bookmarks) {
            const container = document.getElementById(group);
            bookmarks[group].forEach((bookmark, i) => {
                const link = document.createElement("a");
                link.href = bookmark.url;
                link.textContent = bookmark.name;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.className = "animate-fade-in";
                link.style.animationDelay = `${100 + i * 50}ms`;
                container.appendChild(link);
            });
        }

        document.getElementById("header-info").textContent =
            "Platform: " +
            navigator.platform +
            " | User Agent: " +
            navigator.userAgent;

        setTimeout(() => {
            const backgroundVideo = document.getElementById("background-video");
            backgroundVideo.play();
            backgroundVideo.classList.add("visible");
        }, 2000);




    </script>
</body>

</html>
